[package]
name = "ui-perf"
version = "0.0.0"
edition = "2024"
publish = false

# Detached from the parent workspace: this pulls in eframe, and unifying its
# features with the size probes would corrupt those measurements.
[workspace]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow"] }
egui = "0.36.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "console"] }

# Matches the shipping profile from the root Cargo.toml, so spike timings are
# taken on the same codegen the real app will use.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
