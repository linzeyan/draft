name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Every job below runs a Makefile target rather than spelling out cargo flags.
# The profile overrides those targets carry are load-bearing — the payload
# number is a statement about the shipped profile, the timing numbers are a
# statement about representative codegen — and a second copy of them here is how
# "green locally, red in CI" starts.

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    env:
      # Ship-only optimisations cost minutes and change nothing about whether
      # the code is correct. Scoped to this job: leaking them into `budgets`
      # would quietly measure a bundle nobody ships.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: make test

  budgets:
    name: Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # jetli/trunk-action never left Node 20; this is the same release binary
      # it installed, minus the action.
      - name: Install trunk
        run: curl -fsSL https://github.com/trunk-rs/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin"

      # Payload, parse time and layout time. Fails the build when one is
      # exceeded, so a regression arrives with a name and a number.
      - run: make budgets

      # The landing pages are generated by running the shipped CLI over the
      # dialect fixtures, so building them is also a check that the CLI still
      # parses and draws all five.
      - run: make site

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/dist
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Window-system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Build and package
        shell: bash
        run: make desktop
      - uses: actions/upload-artifact@v7
        with:
          name: draft-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
